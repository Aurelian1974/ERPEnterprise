<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Actualizare în curs · ERP</title>
  <meta name="color-scheme" content="light">
  <style>
    /* Pagina e servita de IIS cand aplicatia e oprita, deci nu poate lua tokens.css: valorile sunt
       copiate din src/Web/erp-web/src/theme/tokens.css (ST5) si se schimba o data cu el. */
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: "Segoe UI", system-ui, sans-serif; background: #dde8f7; color: #14233b; }
    main { max-width: 32rem; padding: 2.5rem; background: #eaf1fb; border: 1px solid #bcccea; border-radius: 12px;
           box-shadow: 0 10px 28px rgba(11, 31, 58, .18); text-align: center; }
    h1 { font-size: 1.4rem; margin: 0 0 .75rem; }
    p { margin: .5rem 0; line-height: 1.5; color: #4a5a75; }
  </style>
</head>
<body>
  <main>
    <h1>Aplicația se actualizează.</h1>
    <p>Reveniți în câteva minute.</p>
    <p>Datele introduse până acum sunt păstrate.</p>
  </main>
</body>
</html>
